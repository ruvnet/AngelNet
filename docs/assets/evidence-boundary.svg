<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Three evidence categories: observed, supplied, unassessed</title>
<desc id="desc">Archive URLs, dates and sources are observations. Owner runtime and build exports are supplied claims that still need verification. Current vulnerability, patch status and maintenance history remain unassessed.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f30"/><stop offset="1" stop-color="#09131f"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#269e99" stop-opacity=".26"/><stop offset="1" stop-color="#269e99" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#345267" stroke-width=".5"/></pattern>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.ink{fill:#edf5ff}.muted{fill:#b0bfd0}.cyan{fill:#70ead6}.amber{fill:#ffd398}.lilac{fill:#b9b5ff}
.flow{stroke-dasharray:5 13;animation:flow 5s linear infinite}
.glow{animation:glow 6s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}
.lift{animation:lift 7s ease-in-out infinite}
.phase{animation:phase 12s ease-in-out infinite}
.p2{animation-delay:3s}.p3{animation-delay:6s}.p4{animation-delay:9s}
@keyframes flow{to{stroke-dashoffset:-108}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes phase{0%,30%,100%{stroke-opacity:.25}10%,20%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glow{opacity:1}.phase{stroke-opacity:1}}
</style>
</defs>
<rect width="1200" height="520" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="518" rx="21" fill="url(#grid)" opacity=".3" stroke="#456073"/>
<text x="42" y="40" class="cyan" font-size="13" font-weight="700" letter-spacing="2">02 / PRESERVE</text><text x="42" y="83" class="ink" font-size="30" font-weight="650" >A candidate is a question.</text><text x="42" y="116" class="muted" font-size="18" font-weight="400" >Each record distinguishes an observation, a supplied claim and an unknown.</text><rect x="42" y="163" width="352" height="232" rx="16" fill="#112333" stroke="#2b4358" /><text x="62" y="195" class="cyan" font-size="13" font-weight="700" >OBSERVED IN ARCHIVE</text><text x="62" y="234" class="ink" font-size="23" font-weight="650" >What was captured</text><circle cx="67" cy="272" r="4" class="cyan glow"/><text x="84" y="278" class="muted" font-size="18" font-weight="400" >PHP URL path</text><circle cx="67" cy="315" r="4" class="cyan glow"/><text x="84" y="321" class="muted" font-size="18" font-weight="400" >Capture timestamp</text><circle cx="67" cy="358" r="4" class="cyan glow"/><text x="84" y="364" class="muted" font-size="18" font-weight="400" >Source identity</text><rect x="420" y="163" width="352" height="232" rx="16" fill="#112333" stroke="#2b4358" /><text x="440" y="195" class="lilac" font-size="13" font-weight="700" >SUPPLIED BY OWNER</text><text x="440" y="234" class="ink" font-size="23" font-weight="650" >What needs checking</text><circle cx="445" cy="272" r="4" class="lilac glow"/><text x="462" y="278" class="muted" font-size="18" font-weight="400" >Web runtime and build</text><circle cx="445" cy="315" r="4" class="lilac glow"/><text x="462" y="321" class="muted" font-size="18" font-weight="400" >Export date and reference</text><circle cx="445" cy="358" r="4" class="lilac glow"/><text x="462" y="364" class="muted" font-size="18" font-weight="400" >Authorization reference</text><rect x="798" y="163" width="352" height="232" rx="16" fill="#112333" stroke="#2b4358" /><text x="818" y="195" class="amber" font-size="13" font-weight="700" >STILL UNASSESSED</text><text x="818" y="234" class="ink" font-size="23" font-weight="650" >What remains open</text><circle cx="823" cy="272" r="4" class="amber glow"/><text x="840" y="278" class="muted" font-size="18" font-weight="400" >Current vulnerability</text><circle cx="823" cy="315" r="4" class="amber glow"/><text x="840" y="321" class="muted" font-size="18" font-weight="400" >Actual patch status</text><circle cx="823" cy="358" r="4" class="amber glow"/><text x="840" y="364" class="muted" font-size="18" font-weight="400" >Maintenance history</text><rect x="42" y="425" width="1108" height="64" rx="12" fill="#142936" stroke="#43606b" /><text x="64" y="464" class="ink" font-size="22" font-weight="550" >Evidence can support a review. It cannot silently become a security verdict.</text>
</svg>
