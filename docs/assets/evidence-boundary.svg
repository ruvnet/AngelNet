<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="490" viewBox="0 0 1280 490" role="img" aria-labelledby="title desc">
<title id="title">Observed facts and unknown security state</title><desc id="desc">Observed URLs, dates and hashes stay separate from unknown runtime, ownership, maintenance and exploitability. Owner or host verification is required before a repair decision.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e35"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#1b8f96" stop-opacity=".35"/><stop offset="1" stop-color="#1b8f96" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263651" stroke-width=".5"/></pattern>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.ink{fill:#eef5ff}.muted{fill:#a9b8d0}.cyan{fill:#65e8db}.amber{fill:#ffce83}
.travel{stroke-dasharray:8 18;animation:flow 3s linear infinite}
.pulse{animation:glow 4s ease-in-out infinite}.slow{animation:glow 5s ease-in-out infinite;animation-delay:1s}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.slow{opacity:1}}
</style></defs>
<rect width="1280" height="490" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="488" rx="23" fill="url(#grid)" opacity=".35" stroke="#2b3b55"/>
<text x="42" y="49" class="ink" font-size="24" font-weight="700">EVIDENCE IS NOT A VERDICT</text><text x="42" y="81" class="muted" font-size="18" font-weight="400">Historical content is a reason to investigate. It is not proof of present neglect.</text><rect x="42" y="119" width="470" height="246" rx="16" fill="#102b35" stroke="#31666d"/><text x="66" y="157" class="cyan" font-size="14" font-weight="700">OBSERVED</text><circle cx="74" cy="188" r="5" fill="#65e8db" class="pulse"/><text x="92" y="194" class="ink" font-size="20" font-weight="600">PHP shaped URL</text><text x="92" y="217" class="muted" font-size="15" font-weight="400">A captured path ends in .php</text><circle cx="74" cy="255" r="5" fill="#65e8db" class="pulse"/><text x="92" y="261" class="ink" font-size="20" font-weight="600">Capture timestamp</text><text x="92" y="284" class="muted" font-size="15" font-weight="400">The archive recorded a page on this date</text><circle cx="74" cy="322" r="5" fill="#65e8db" class="pulse"/><text x="92" y="328" class="ink" font-size="20" font-weight="600">Source identity</text><text x="92" y="351" class="muted" font-size="15" font-weight="400">File and payload hashes preserve provenance</text><rect x="594" y="119" width="642" height="246" rx="16" fill="#262337" stroke="#64516a"/><text x="620" y="157" class="amber" font-size="14" font-weight="700">STILL UNKNOWN</text><circle cx="628" cy="191" r="5" fill="#ffce83" class="slow"/><text x="646" y="197" class="ink" font-size="18" font-weight="500">Installed PHP runtime and patch provenance</text><circle cx="628" cy="246" r="5" fill="#ffce83" class="slow"/><text x="646" y="252" class="ink" font-size="18" font-weight="500">Whether the current owner or application is the same</text><circle cx="628" cy="301" r="5" fill="#ffce83" class="slow"/><text x="646" y="307" class="ink" font-size="18" font-weight="500">Actual maintenance history and exploitability</text><path d="M553 137V350" fill="none" stroke="#7784a3" stroke-width="2" class="travel"/><rect x="42" y="397" width="1194" height="58" rx="11" fill="#14233b" stroke="#3b516e"/><text x="66" y="433" class="cyan" font-size="13" font-weight="700">NEXT STEP</text><text x="180" y="434" class="ink" font-size="21" font-weight="550">Owner or host verification before a repair decision.</text>
</svg>
