<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
<title id="title">AngelNet archive ingestion pipeline</title><desc id="desc">Archive metadata and WET text flow through an evidence store to local vector retrieval and review exports. All stages preserve provenance. Candidate websites are not contacted.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e35"/><stop offset="1" stop-color="#080f20"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#1b8f96" stop-opacity=".35"/><stop offset="1" stop-color="#1b8f96" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#263651" stroke-width=".5"/></pattern>
<style>
text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.ink{fill:#eef5ff}.muted{fill:#a9b8d0}.cyan{fill:#65e8db}.amber{fill:#ffce83}
.travel{stroke-dasharray:8 18;animation:flow 3s linear infinite}
.pulse{animation:glow 4s ease-in-out infinite}.slow{animation:glow 5s ease-in-out infinite;animation-delay:1s}
@keyframes flow{to{stroke-dashoffset:-104}}
@keyframes glow{0%,100%{opacity:.4}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.pulse,.slow{opacity:1}}
</style></defs>
<rect width="1280" height="510" rx="24" fill="url(#bg)"/>
<rect x="1" y="1" width="1278" height="508" rx="23" fill="url(#grid)" opacity=".35" stroke="#2b3b55"/>
<text x="42" y="49" class="ink" font-size="24" font-weight="700">FROM ARCHIVE TO REVIEW</text><text x="42" y="81" class="muted" font-size="18" font-weight="400">Two ingestion paths. One evidence model.</text><path d="M294 180H351V250H392M294 332H351V250M662 250H736M1006 250H1050" fill="none" stroke="#304a64" stroke-width="3"/>
<path d="M294 180H351V250H392M294 332H351V250M662 250H736M1006 250H1050" fill="none" stroke="#65e8db" stroke-width="2" class="travel"/>
<rect x="42" y="124" width="252" height="114" rx="14" fill="#111f34" stroke="#38516d"/><text x="60" y="151" class="cyan" font-size="13" font-weight="700">01A</text><text x="60" y="178" class="ink" font-size="21" font-weight="650">Archive metadata</text><text x="60" y="204" class="muted" font-size="15" font-weight="400">CDX and Wayback</text><text x="60" y="226" class="muted" font-size="13" font-weight="400">URL · capture date · source</text><rect x="42" y="276" width="252" height="114" rx="14" fill="#111f34" stroke="#38516d"/><text x="60" y="303" class="cyan" font-size="13" font-weight="700">01B</text><text x="60" y="330" class="ink" font-size="21" font-weight="650">WET page text</text><text x="60" y="356" class="muted" font-size="15" font-weight="400">Byte framed parsing</text><text x="60" y="378" class="muted" font-size="13" font-weight="400">Text · record ID · hash</text><rect x="392" y="170" width="270" height="160" rx="14" fill="#111f34" stroke="#38516d"/><text x="410" y="197" class="cyan" font-size="13" font-weight="700">02</text><text x="410" y="224" class="ink" font-size="21" font-weight="650">Evidence store</text><text x="410" y="250" class="muted" font-size="15" font-weight="400">SQLite and deduplication</text><text x="410" y="318" class="muted" font-size="13" font-weight="400">Unknowns stay explicit</text><rect x="736" y="170" width="270" height="160" rx="14" fill="#111f34" stroke="#38516d"/><text x="754" y="197" class="cyan" font-size="13" font-weight="700">03</text><text x="754" y="224" class="ink" font-size="21" font-weight="650">Local retrieval</text><text x="754" y="250" class="muted" font-size="15" font-weight="400">Native RuVector</text><text x="754" y="318" class="muted" font-size="13" font-weight="400">384 dimensional lexical vectors</text><rect x="1050" y="186" width="186" height="128" rx="14" fill="#282738" stroke="#92724c"/><text x="1070" y="220" class="amber" font-size="13" font-weight="700">04</text><text x="1070" y="249" class="ink" font-size="24" font-weight="650">Review</text><text x="1070" y="276" class="muted" font-size="16" font-weight="400">CSV · JSONL</text><text x="1070" y="299" class="muted" font-size="13" font-weight="400">Evidence attached</text><rect x="42" y="426" width="1194" height="52" rx="10" fill="#102936" stroke="#28515b"/><text x="62" y="459" class="cyan" font-size="18" font-weight="500">Candidate websites receive zero requests from these ingestion scripts.</text>
</svg>
