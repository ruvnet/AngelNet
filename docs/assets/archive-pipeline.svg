<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="655" viewBox="0 0 1200 655" role="img" aria-labelledby="title desc">
<title id="title">The metadata and WET paths in AngelNet</title>
<desc id="desc">Archive metadata enters a PHP candidate index and review queue. Local WET files produce text documents for RuVector lexical retrieval, and PHP paths also enter the candidate index. Owner inventory can supplement review. Discovery does not contact candidate websites.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101f30"/><stop offset="1" stop-color="#09131f"/></linearGradient>
<radialGradient id="halo"><stop stop-color="#269e99" stop-opacity=".26"/><stop offset="1" stop-color="#269e99" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M48 0H0V48" fill="none" stroke="#345267" stroke-width=".5"/></pattern>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.ink{fill:#edf5ff}.muted{fill:#b0bfd0}.cyan{fill:#70ead6}.amber{fill:#ffd398}.lilac{fill:#b9b5ff}
.flow{stroke-dasharray:5 13;animation:flow 5s linear infinite}
.glow{animation:glow 6s ease-in-out infinite}
.orbit{transform-box:fill-box;transform-origin:center;animation:orbit 28s linear infinite}
.lift{animation:lift 7s ease-in-out infinite}
.phase{animation:phase 12s ease-in-out infinite}
.p2{animation-delay:3s}.p3{animation-delay:6s}.p4{animation-delay:9s}
@keyframes flow{to{stroke-dashoffset:-108}}
@keyframes glow{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes orbit{to{transform:rotate(360deg)}}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes phase{0%,30%,100%{stroke-opacity:.25}10%,20%{stroke-opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}.glow{opacity:1}.phase{stroke-opacity:1}}
</style>
</defs>
<rect width="1200" height="655" rx="22" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="653" rx="21" fill="url(#grid)" opacity=".3" stroke="#456073"/>
<text x="42" y="40" class="cyan" font-size="13" font-weight="700" letter-spacing="2">01 / DISCOVER</text><text x="42" y="83" class="ink" font-size="30" font-weight="650" >Two inputs. Different jobs.</text><text x="42" y="116" class="muted" font-size="18" font-weight="400" >Metadata finds candidates. Page text supports retrieval.</text><path d="M354 232H440" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M354 232H440" fill="none" stroke="#70ead6" stroke-width="2" class="flow"/><path d="M752 232H838" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M752 232H838" fill="none" stroke="#70ead6" stroke-width="2" class="flow"/><path d="M354 475H440" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M354 475H440" fill="none" stroke="#70ead6" stroke-width="2" class="flow"/><path d="M752 475H838" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M752 475H838" fill="none" stroke="#70ead6" stroke-width="2" class="flow"/><rect x="42" y="160" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="62" y="189" class="cyan" font-size="13" font-weight="700" >PUBLIC ARCHIVE</text><text x="62" y="227" class="ink" font-size="26" font-weight="650" >CDX metadata</text><text x="62" y="261" class="muted" font-size="18" font-weight="400" >Static files or query API</text><text x="62" y="295" class="muted" font-size="16" font-weight="400" >URLs · dates · source</text><rect x="440" y="160" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="460" y="189" class="cyan" font-size="13" font-weight="700" >LOCAL INDEX</text><text x="460" y="227" class="ink" font-size="26" font-weight="650" >PHP candidates</text><text x="460" y="261" class="muted" font-size="18" font-weight="400" >SQLite + CSV + JSONL</text><text x="460" y="295" class="muted" font-size="16" font-weight="400" >Evidence stays attached</text><rect x="838" y="160" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="858" y="189" class="amber" font-size="13" font-weight="700" >REVIEW QUEUE</text><text x="858" y="227" class="ink" font-size="26" font-weight="650" >Missing facts</text><text x="858" y="261" class="muted" font-size="18" font-weight="400" >Deployment + build history</text><text x="858" y="295" class="muted" font-size="16" font-weight="400" >Assessment stays explicit</text><rect x="42" y="405" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="62" y="434" class="lilac" font-size="13" font-weight="700" >LOCAL FILE</text><text x="62" y="472" class="ink" font-size="26" font-weight="650" >WET page text</text><text x="62" y="506" class="muted" font-size="18" font-weight="400" >Bounded record parsing</text><text x="62" y="540" class="muted" font-size="16" font-weight="400" >Text · dates · hashes</text><rect x="440" y="405" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="460" y="434" class="lilac" font-size="13" font-weight="700" >LOCAL CORPUS</text><text x="460" y="472" class="ink" font-size="26" font-weight="650" >Text documents</text><text x="460" y="506" class="muted" font-size="18" font-weight="400" >Normalized archive records</text><text x="460" y="540" class="muted" font-size="16" font-weight="400" >PHP paths also enter index</text><rect x="838" y="405" width="312" height="160" rx="16" fill="#112333" stroke="#2b4358" /><text x="858" y="434" class="lilac" font-size="13" font-weight="700" >RUVECTOR</text><text x="858" y="472" class="ink" font-size="26" font-weight="650" >Lexical retrieval</text><text x="858" y="506" class="muted" font-size="18" font-weight="400" >384 dimensional vectors</text><text x="858" y="540" class="muted" font-size="16" font-weight="400" >Rank wording similarity</text><path d="M596 405V320" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M596 405V320" fill="none" stroke="#b9b5ff" stroke-width="2" class="flow"/><text x="610" y="369" class="lilac" font-size="14" font-weight="400" >PHP paths</text><path d="M994 368V320" fill="none" stroke="#2b4358" stroke-width="3"/><path d="M994 368V320" fill="none" stroke="#ffd398" stroke-width="2" class="flow"/><rect x="847" y="353" width="294" height="34" rx="17" fill="#102932" stroke="#34545c" /><text x="863" y="376" class="amber" font-size="14" font-weight="650" >OPTIONAL OWNER INVENTORY</text><text x="42" y="621" class="cyan" font-size="19" font-weight="500" >Discovery reads archive providers. Candidate websites receive zero requests.</text>
</svg>
